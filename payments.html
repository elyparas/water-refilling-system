<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaTrack | Payments</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="payments">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Payments</h1><p>Record payments and monitor balances</p></div>
      <div class="actions"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="text" placeholder="Search payment..."></div></div>
    </div>

    <section class="stats">
      <div class="stat"><div class="icon"><i class="fa-solid fa-peso-sign"></i></div><div><h3 id="st-collected">-</h3><span>Total Collected</span></div></div>
      <div class="stat"><div class="icon"><i class="fa-solid fa-hourglass-half"></i></div><div><h3 id="st-unpaid">-</h3><span>Unpaid Balance</span></div></div>
    </section>

    <section class="card">
      <div class="card-header"><h2>Record Payment</h2></div>
      <form id="form" class="form-grid three">
        <div class="field"><label>Order</label><select name="order_id" required></select><div class="hint" id="hint"></div></div>
        <div class="field"><label>Amount (₱)</label><input name="amount" type="number" min="0.01" step="0.01" placeholder="0.00" required></div>
        <div class="field"><label>Method</label><select name="method"><option>Cash</option><option>GCash</option><option>Bank Transfer</option></select></div>
        <div class="field"><button class="btn" type="submit"><i class="fa-solid fa-check"></i> Save Payment</button></div>
      </form>
    </section>

    <section class="card">
      <div class="card-header"><h2>Payment History</h2></div>
      <table class="searchable">
        <thead><tr><th>ID</th><th>Order #</th><th>Customer</th><th>Amount</th><th>Method</th><th>Date</th><th>Order Status</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/payments.js"></script>
</body>
</html>
