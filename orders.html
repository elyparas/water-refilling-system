<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AquaTrack | Orders</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="orders">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main">
    <div class="topbar">
      <div><h1>Orders</h1><p>Create and track customer orders</p></div>
      <div class="actions"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" type="text" placeholder="Search order..."></div></div>
    </div>

    <section class="card">
      <div class="card-header"><h2>New Order</h2></div>
      <form id="form" class="form-grid three">
        <div class="field"><label>Customer</label><select name="customer_id" required></select></div>
        <div class="field"><label>Staff</label><select name="staff_id" required></select></div>
        <div class="field"><label>Status</label>
          <select name="status"><option>Pending</option><option>Refilling</option><option>Ready for Pickup</option><option>Out for Delivery</option></select></div>
        <div class="field"><label>Delivery Fee (₱)</label><input name="delivery_fee" type="number" min="0" step="0.01" value="0"></div>
        <div class="field"><label>Container Deposit (₱)</label><input name="container_deposit" type="number" min="0" step="0.01" value="0"></div>
        <div></div>

        <div class="field full">
          <label>Items</label>
          <div id="items"></div>
          <button type="button" class="link-btn" id="addItem"><i class="fa-solid fa-plus"></i> Add another item</button>
        </div>
        <div class="field full"><div class="total-box"><span>Estimated Total</span><span id="total">₱0.00</span></div></div>
        <div class="field"><button class="btn" type="submit"><i class="fa-solid fa-plus"></i> Create Order</button></div>
      </form>
    </section>

    <section class="card">
      <div class="card-header"><h2>Order List</h2></div>
      <table class="searchable">
        <thead><tr><th>Order #</th><th>Customer</th><th>Date</th><th>Total</th><th>Balance</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </section>
  </main>
  <script src="js/layout.js"></script>
  <script src="js/app.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
